[project]
name = "hermes-dynamic-workflow"
version = "1.2.5"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.16",
    "tiktoken>=0.5",
    "transformers>=4.30",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["N999", "E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
bdd_features_base_dir = "tests/features"

[tool.coverage.run]
source = ["workflow", "storage", "observability"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
