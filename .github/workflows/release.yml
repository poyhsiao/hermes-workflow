name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Verify version in plugin.yaml
        run: |
          python -c "
          import yaml, re, sys
          with open('plugin.yaml') as f:
              data = yaml.safe_load(f)
          tag = sys.argv[1]
          # Strip prerelease suffix for comparison
          base_version = re.sub(r'-(rc|beta)\.\d+$', '', tag)
          expected = base_version.lstrip('v')
          actual = data['version']
          if actual != expected:
              print(f'ERROR: plugin.yaml version={actual} but tag={expected}')
              sys.exit(1)
          print(f'Version match: {actual}')
          " "${github.ref_name}"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install pytest pytest-cov pyyaml
          python -m pytest tests/ -v --tb=short

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Get version tag
        id: version
        run: echo "VERSION=${github.ref_name#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
