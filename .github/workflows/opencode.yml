name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set LLM API key env
        env:
          LLM_SERVICE_PROVIDER: ${{ secrets.LLM_SERVICE_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          # Export the API key with the provider's env var name (e.g. ANTHROPIC_API_KEY)
          PROVIDER_VAR="${LLM_SERVICE_PROVIDER}_API_KEY"
          echo "Setting $PROVIDER_VAR"
          echo "$PROVIDER_VAR=$LLM_API_KEY" >> $GITHUB_ENV

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        with:
          model: ${{ secrets.LLM_MODEL_NAME }}
